name: Stale

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            if there is no further activity. Comment to keep it open — thanks for
            helping keep the tracker tidy!
          stale-pr-message: >
            This pull request has been inactive for 60 days. It will be closed in
            14 days if there is no further activity. Push a commit or comment to
            keep it open.
          close-issue-message: >
            Closing this issue due to inactivity. Please reopen or file a new
            issue if this is still relevant.
          close-pr-message: >
            Closing this pull request due to inactivity. Feel free to reopen when
            you are ready to continue.
          exempt-issue-labels: "good first issue,help wanted"
          operations-per-run: 60
