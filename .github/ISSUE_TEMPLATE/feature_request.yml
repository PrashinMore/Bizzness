name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Share the problem you are solving first — solutions second. Check the [roadmap](../../ROADMAP.md) and existing issues before filing.
  - type: textarea
    id: problem
    attributes:
      label: Problem being solved
      description: What pain point or use case should this address?
      placeholder: As a multi-outlet owner, I cannot easily compare daily sales across outlets…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine this working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, or related issues.
    validations:
      required: false
