# Labels for the EZCommerse repository.
# Apply with GitHub CLI: `gh label sync --file .github/labels.yml`
# or create manually to match these names/colors.

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: question
  color: "d876e3"
  description: Further information is requested

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

- name: needs-triage
  color: "fbca04"
  description: Needs review from a maintainer
